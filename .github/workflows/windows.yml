name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check release version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          if ($env:GITHUB_REF_NAME -ne "v$($pom.project.version)") { throw 'Tag and pom.xml version must match.' }
      - name: Build and test
        run: .\mvnw.cmd -B clean verify
      - name: Package portable app and matching sources
        shell: pwsh
        run: ./scripts/package-windows.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: rubiks-cube-scramble-widget-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rubiks-cube-scramble-widget-windows-x64
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
